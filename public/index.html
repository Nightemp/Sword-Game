<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sword Duel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #14100e;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: #fff;
    user-select: none;
    touch-action: none;
  }

  #arena {
    display: block;
    width: 100%;
    height: 100%;
    background: linear-gradient(#3a2f28, #6b5644);
  }

  #status {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 18px;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    pointer-events: none;
  }

  .hp-container {
    position: absolute;
    top: 12px;
    width: 40%;
    height: 14px;
    background: rgba(0,0,0,0.5);
    border: 2px solid #fff;
    border-radius: 7px;
    overflow: hidden;
  }
  #hp0-wrap { left: 12px; }
  #hp1-wrap { right: 12px; }

  .hp-bar {
    height: 100%;
    width: 100%;
    transition: width 0.15s ease-out;
  }
  #hp0 { background: #4a7c59; }
  #hp1 { background: #7c4a4a; }

  #joystick-zone {
    position: absolute;
    left: 24px;
    bottom: 50px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.3);
  }
  #joystick-knob {
    position: absolute;
    left: 51px;
    top: 51px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
  }

  #attack-btn {
    position: absolute;
    right: 24px;
    bottom: 50px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255,80,80,0.35);
    border: 2px solid rgba(255,120,120,0.6);
    color: #fff;
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>
<body>

<canvas id="arena"></canvas>
<div id="status"></div>

<div id="hp0-wrap" class="hp-container"><div id="hp0" class="hp-bar"></div></div>
<div id="hp1-wrap" class="hp-container"><div id="hp1" class="hp-bar"></div></div>

<div id="joystick-zone">
  <div id="joystick-knob"></div>
</div>
<button id="attack-btn">УДАР</button>

<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>
</body>
</html>
