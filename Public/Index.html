<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Дуэль на мечах</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1a1410; font-family: sans-serif; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #arena { display: block; width: 100%; height: 70vh; background: linear-gradient(#3a2f28, #5b4636); }
  #hud { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 16px; }
  .hp-bar { width: 40%; height: 16px; background: #333; border-radius: 8px; overflow: hidden; border: 1px solid #000; }
  .hp-fill { height: 100%; background: #d62828; transition: width 0.2s; }
  #controls {
    position: fixed; bottom: 0; left: 0; right: 0; height: 30vh;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; box-sizing: border-box;
  }
  #joystick-zone {
    width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,0.08); position: relative;
  }
  #joystick-knob {
    width: 60px; height: 60px; border-radius: 50%;
    background: rgba(255,255,255,0.35); position: absolute;
    top: 35px; left: 35px; pointer-events: none;
  }
  #attack-btn {
    width: 110px; height: 110px; border-radius: 50%;
    background: #d62828; color: white; font-size: 16px; font-weight: bold;
    border: 3px solid #7a1414; display: flex; align-items: center; justify-content: center;
  }
  #attack-btn:active { background: #a91d1d; }
  #status { position: absolute; top: 40%; left: 0; right: 0; text-align: center; color: white; font-size: 20px; }
</style>
</head>
<body>
  <div id="hud">
    <div class="hp-bar"><div id="hp0" class="hp-fill" style="width:100%"></div></div>
    <div class="hp-bar"><div id="hp1" class="hp-fill" style="width:100%"></div></div>
  </div>
  <canvas id="arena"></canvas>
  <div id="status"></div>

  <div id="controls">
    <div id="joystick-zone"><div id="joystick-knob"></div></div>
    <div id="attack-btn">УДАР</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
